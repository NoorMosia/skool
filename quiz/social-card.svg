<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="WRPV302 Advanced Programming study quiz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#2a2a2e" stroke-width="2"/>

  <!-- logo mark -->
  <g transform="translate(96,150)">
    <rect width="150" height="150" rx="32" fill="#0a0a0b" stroke="#2a2a2e" stroke-width="3"/>
    <circle cx="68" cy="70" r="36" fill="none" stroke="#a371f7" stroke-width="14"/>
    <line x1="90" y1="92" x2="114" y2="116" stroke="#a371f7" stroke-width="14" stroke-linecap="round"/>
    <circle cx="68" cy="70" r="10" fill="#3fb950"/>
  </g>

  <!-- text -->
  <text x="300" y="250" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="78" font-weight="700" fill="#ececee">WRPV302 Quiz</text>
  <text x="300" y="320" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="40" fill="#9a9aa3">Advanced Programming &#183; exam revision</text>

  <!-- type chips -->
  <g font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="30" font-weight="600">
    <g transform="translate(300,400)">
      <rect width="250" height="64" rx="32" fill="#1d1d20" stroke="#3a3350" stroke-width="2"/>
      <text x="125" y="42" text-anchor="middle" fill="#a371f7">Multiple choice</text>
    </g>
    <g transform="translate(570,400)">
      <rect width="210" height="64" rx="32" fill="#1d1d20" stroke="#3a3350" stroke-width="2"/>
      <text x="105" y="42" text-anchor="middle" fill="#a371f7">Multi-select</text>
    </g>
    <g transform="translate(800,400)">
      <rect width="200" height="64" rx="32" fill="#1d1d20" stroke="#3a3350" stroke-width="2"/>
      <text x="100" y="42" text-anchor="middle" fill="#a371f7">True / False</text>
    </g>
    <g transform="translate(300,484)">
      <rect width="230" height="64" rx="32" fill="#1d1d20" stroke="#3a3350" stroke-width="2"/>
      <text x="115" y="42" text-anchor="middle" fill="#a371f7">Fill the blank</text>
    </g>
    <g transform="translate(550,484)">
      <rect width="380" height="64" rx="32" fill="#16301f" stroke="#3fb950" stroke-width="2"/>
      <text x="190" y="42" text-anchor="middle" fill="#3fb950">11 lectures &#183; 182 questions</text>
    </g>
  </g>
</svg>
